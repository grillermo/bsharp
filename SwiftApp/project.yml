name: ElisaMusica
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/ElisaMusica.xcconfig
  Release: Config/ElisaMusica.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  ElisaKit:
    path: ElisaKit
targets:
  ElisaMusica:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ElisaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ELISA_MUSICA_BUNDLE_ID)
        PRODUCT_NAME: ElisaMusica
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Elisa música
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        # Full screen only: a child shouldn't land in Split View, and it lets the iPad
        # support every orientation without multitasking constraints.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - HelloHeadline.ttf
          - OpenSans-Regular.ttf
          - OpenSans-Bold.ttf
        # Filled by ./deploy on the xcodebuild command line; empty otherwise.
        ElisaMusicaOTAManifestURL: $(ELISA_MUSICA_OTA_MANIFEST_URL)
        ElisaMusicaDevLogURL: $(ELISA_MUSICA_DEVLOG_URL)
        # Lets a ./deploy --devlog build reach http://<mac>.local on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
